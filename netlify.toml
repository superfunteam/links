# The site is published from public/, which is assembled by tools/stage.mjs.
# Publishing the repo root would expose puzzles.json — every answer, in plaintext.
[build]
  command = "node build.mjs && node tools/stage.mjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Friendlier URLs for the API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The invite card image a shared code unfurls into
[[redirects]]
  from = "/og/:code"
  to = "/.netlify/functions/og?code=:code"
  status = 200

# Join links: links.superfun.games/AB12 opens the app with the code prefilled,
# and the invite function swaps the OG tags so the link unfurls personally.
# Non-forced, so real files (/backroom, assets) are still served first.
[[redirects]]
  from = "/:code"
  to = "/.netlify/functions/invite?code=:code"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
